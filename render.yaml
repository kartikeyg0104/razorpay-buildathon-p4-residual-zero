# Render Blueprint for Residual Zero.
#
# Docker rather than the Python runtime, for one concrete reason: production requires the
# `postgres` optional dependency (`psycopg`), and a buildpack that runs a bare
# `pip install .` would omit it. The app would then refuse to start - correctly, because
# RZ_ENV=production rejects a non-PostgreSQL database - but for a reason that reads like a
# configuration bug. The Dockerfile installs `.[postgres]` explicitly, runs as a non-root
# user, and is the same image verified locally.
#
# The database is Neon and stays Neon. This blueprint deliberately declares NO Render
# database: the production store is external, and creating one here would give the service
# a second, empty database to silently prefer.

services:
  - type: web
    name: residual-zero
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free. The earlier `starter` here was an unmeasured guess about ortools/scipy/pandas
    # memory, and it was wrong twice over: measured under a hard 512 MiB cgroup limit the
    # service peaks at 103.6 MiB (20%) after exercising all 19 surfaces, five close-pack
    # and journal builds, an AI investigation and five solver-backed proof pages - zero OOM
    # kills, zero restarts. ortools, scipy, pandas, numpy and lxml are declared
    # dependencies but are never mapped into the serving process at all; only psycopg is.
    #
    # Free instances sleep after ~15 minutes idle and cold-start in roughly a minute. That
    # is a demo consideration, not a correctness one - see docs/DEPLOYMENT.md.
    plan: free
    # MUST co-locate with the Neon database. The Neon endpoint is us-east-2 (AWS Ohio),
    # so this is `ohio`. Measured: one fresh connection to Neon costs 2550 ms from ~12,000 km
    # away versus 2.1 ms on the same host, and a credit page opens six connections - which
    # is 24,021 ms versus 94 ms for byte-identical code. The application is not slow; the
    # round trip is. Moving this service to a region away from the database is the single
    # most expensive change anyone could make to it.
    region: ohio
    branch: main
    autoDeploy: true

    # Liveness only: returns {"ok": true, "service": "residual-zero"}. It opens no database
    # connection, calls no AI provider, runs no reconciliation and reads no financial state,
    # so a health probe can never be the thing that wakes the engine.
    healthCheckPath: /healthz

    # No `disk:` on purpose. The only writable path is /app/var, which holds the AI
    # investigation log (observability - it degrades to a warning if unwritable) and
    # per-organisation SQLite files, which are never created when the backend is
    # PostgreSQL. Nothing durable lives outside Neon, so a disk would imply state that
    # should not exist here.

    envVars:
      # ---------------------------------------------------------------- deployment mode
      # Production refuses to start without authentication, a session secret, an https
      # origin and a PostgreSQL URL - enforced at module import, so it holds under any
      # start command, not just `python -m`.
      - key: RZ_ENV
        value: production
      - key: RZ_AUTH_MODE
        value: required
      # Render terminates TLS and forwards X-Forwarded-Proto/For.
      - key: RZ_TRUST_PROXY
        value: "1"
      - key: RZ_HOST
        value: 0.0.0.0
      - key: RZ_LOG_LEVEL
        value: INFO

      # RZ_PORT is intentionally absent. Render injects PORT, and the app prefers RZ_PORT
      # over PORT - setting it here would bind the wrong port and fail the health check
      # while the process looked healthy.

      # RZ_PUBLIC_ORIGIN is intentionally absent too: it falls back to RENDER_EXTERNAL_URL,
      # which Render sets to this service's own https URL. Add RZ_PUBLIC_ORIGIN explicitly
      # only when putting a custom domain in front.

      # ---------------------------------------------------------------- secrets
      # sync: false means "prompt me, never store it in git". Set these in the Render
      # dashboard (or at blueprint apply time). Nothing secret belongs in this file.
      - key: RZ_SESSION_SECRET
        generateValue: true          # Render generates and stores a strong value
      - key: RZ_DATABASE_URL         # Neon pooled connection string, with sslmode=require
        sync: false
      - key: NVIDIA_API_KEY          # server-side only; never reaches a browser or the extension
        sync: false

      # ---------------------------------------------------------------- AI provider
      # NVIDIA NIM is the only supported live backend. An unrecognised value resolves to no
      # endpoint and makes no call.
      - key: AI_PROVIDER
        value: nvidia
      - key: AI_MODEL
        value: openai/gpt-oss-20b
      - key: AI_TIMEOUT_S
        value: "30"
      - key: AI_TOTAL_BUDGET_S
        value: "40"

      # ---------------------------------------------------------------- optional
      # Optional, and empty is the right default - declared with an explicit empty value
      # rather than sync:false so applying the blueprint prompts for exactly two secrets
      # (RZ_DATABASE_URL and NVIDIA_API_KEY) and nothing else. Fill either in the dashboard
      # if you later need it.
      #
      # Extra browser origins allowed to read the API, comma-separated.
      - key: RZ_ALLOWED_ORIGINS
        value: ""
      # Chrome extension ids allowed as CORS origins. The extension authenticates with a
      # bearer token and does not need this unless an extension page must read a
      # cross-origin response.
      - key: RZ_EXTENSION_IDS
        value: ""
      # Set to 0 to close self-service signup for a judged demo.
      - key: RZ_ALLOW_SIGNUP
        value: "1"
