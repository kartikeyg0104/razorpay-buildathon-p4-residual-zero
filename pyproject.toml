[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "residual-zero"
version = "0.1.0"
description = "Settlement reconciliation as signed subset-sum with a uniqueness guarantee and a checkable proof"
requires-python = ">=3.11"

# Phase 1 dependencies plus Phase 2 OR-Tools (F31) and Phase 3 lxml (F45).
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pandas>=2.1",
    "rapidfuzz>=3.6",
    "scipy>=1.11",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    # Login and signup are HTML forms, and FastAPI's Form() requires this to read one.
    "python-multipart>=0.0.9",
    "ortools>=9.8",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.98",    # property tests on the arithmetic invariant
    # starlette.testclient needs httpx2. Without it every console test had to call route
    # endpoint functions directly, so FastAPI's own routing, path/query coercion, validation
    # errors and status codes were never exercised by the suite (found 2026-09).
    # It must be httpx2, not httpx: starlette warns on plain httpx and filterwarnings=error
    # turns that warning into a failure.
    "httpx2",
]
# Browser certification only. Kept out of `dev` so unit and integration tests install
# without a browser toolchain. After installing, fetch the browser binary once:
#   python -m playwright install chromium
e2e = [
    "playwright>=1.44",
]
# The production database driver. Kept optional so a local clone, the eval harness and CI
# install and run on SQLite with no Postgres toolchain present.
postgres = [
    "psycopg[binary]>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = [
    "error",
    # starlette's TestClient still imports the `anyio.abc.BlockingPortal` alias, which
    # anyio 4.15 deprecated. It is a third-party deprecation in a dependency we do not
    # control, and with `error` as the default it turns a fresh `pip install` into a
    # collection failure (caught by cloning the repo into a clean venv). Scoped to that
    # one message so every other warning is still an error.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
markers = [
    "e2e: live browser tests against http://127.0.0.1:8765 (set RZ_E2E=1)",
]

[tool.setuptools.package-data]
"residual_zero" = ["console/templates/*.html", "console/static/*"]
