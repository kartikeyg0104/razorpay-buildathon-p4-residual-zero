[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "residual-zero"
version = "0.1.0"
description = "Settlement reconciliation as signed subset-sum with a uniqueness guarantee and a checkable proof"
requires-python = ">=3.11"

# Phase 1 dependencies plus Phase 2 OR-Tools (F31). Still absent: lxml (F45), sklearn (F38 unused).
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pandas>=2.1",
    "rapidfuzz>=3.6",
    "scipy>=1.11",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "ortools>=9.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.98",    # property tests on the arithmetic invariant
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["error"]

[tool.setuptools.package-data]
"residual_zero" = ["console/templates/*.html", "console/static/*"]
