# Statutory rates. NN-8: every entry carries an integer basis-point value, a primary
# source_url, and the as_of date it was read. The loader RAISES UnverifiedRateError on
# any TBD-VERIFY value, so nothing in this system can run against an unverified rate.
#
# Units: `bps` is an integer count of basis points. 1800 bps = 18.00%. A rate needing
# finer resolution than one basis point gets a `_micro_bps` key rather than a float.

gst_on_fee:
  bps: 1800
  source_url: "https://razorpay.com/pricing/"
  as_of: "2026-08-27"
  note: >-
    GST is levied on the platform FEE, not on the transaction value. Razorpay's published
    pricing states "GST on platform fee | 18%" and clarifies it "applies on Razorpay's
    service fee, not on the underlying transaction amount". The compounding
    gst = fee x rate is the step spec §3.2 notes spreadsheets drift on.
    Source is Razorpay's own published fee and tax documentation, which spec §3.2
    explicitly sanctions as a primary source.

withholding:
  bps: 10
  base: GROSS_PAYMENTS
  source_url: "https://www.incometaxindia.gov.in/documents/20117/6476327/Finance_Bill-2024.pdf/d4230fc9-cdfd-6f4e-549c-6d54c832e131?t=1762782722087&version=1.0"
  as_of: "2026-08-27"
  note: >-
    Section 194-O of the Income-tax Act, 1961: tax deducted by an e-commerce operator on
    the GROSS amount of sale of goods or provision of services credited to an e-commerce
    participant. Finance (No. 2) Bill, 2024, clause 61 (official Income Tax Department
    text): in section 194-O(1), for the words "one per cent.", the figures and word
    "0.1 per cent." shall be substituted with effect from 1 October 2024. 0.1% = 10
    integer basis points. Confirmed against the department's own TDS-rate FAQ
    (incometaxindia.gov.in, fetched 2026-08-27) which lists Section 194-O at 0.1.
    MODELLING ASSUMPTION (PLAN-QUESTIONS.md Q1 option A'): the Phase 1 synthetic
    merchant is a participant on an e-commerce operator's platform, so 194-O applies
    on gross captured payments. A plain payment-aggregator merchant on their own
    storefront would not attract 194-O; that is documented in docs/DATA.md and ADR-9.
    Corruption class 13 WITHHOLDING_GAP and the SUSPECTED_WITHHOLDING diagnosis exist
    because of this assumption. Threshold (Rs 5 lakh for resident Individual/HUF) is
    not modelled: the synthetic merchant is above it by construction.
